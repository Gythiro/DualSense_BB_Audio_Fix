[BBFix]
; 将游戏的 DualSense HD 触觉音频从 WASAPI 独占模式无感转为低延迟共享模式，
; 解除音频设备独占锁，使「手柄喇叭播放 BB 语音」与「原生 HD 触觉反馈 + 自适应扳机」完美共存。
EnableSharedModeHaptics=1

; 修复《死亡搁浅：导演剪辑版》音频菜单切换 BB 输出设备时的底层寄存器漏传 Bug (RVA 0x1DD4A00)，
; 开启后无需“二次盲切”，在游戏菜单里直接选择手柄扬声器即可一次生效，界面与实际输出完全一致。
FixBBDeviceSwapBug=1

; DualSense HD 触觉震动强度倍率（默认 1.0 = 100% 原生强度，可调范围 0.0 ~ 4.0）
HapticsGain=1.0

; 修复游戏发给手柄的 HID 音频路由（游戏把扬声器路由设为“仅耳机”，导致手柄喇叭被关）。
; 开启后 Haute 4DS「DS 扬声器模式 = 跟随游戏」以及 USB 有线直连也能让手柄喇叭出 BB 声音。
; 插入 3.5mm 耳机时仍尊重游戏自己的耳机判断，不强行改路由。（1 = 开启，0 = 关闭）
FixDualSenseSpeakerRouting=1

; 扬声器路由：3 = 右声道→喇叭、耳机静音（Linux 驱动默认）；2 = 左声道→耳机两侧、右声道→喇叭
SpeakerOutputPath=3

; 手柄喇叭硬件音量（61 ~ 100，默认 100）
SpeakerVolume=100

; 手柄喇叭前置增益（0 ~ 7，默认 2，与 Haute 网页“扬声器增益 2”一致）
SpeakerPreampGain=2

; 补丁加载时尚未收到游戏的耳机判断时，先假定“未插耳机”并打开喇叭（1 = 是，0 = 否）
AssumeNoHeadsetAtStart=1

; 每隔多少毫秒重新下发一次喇叭路由（防止被适配器或游戏重置；0 = 只在游戏自己下发音频设置时修补）
SpeakerReassertIntervalMs=1000

; 是否在游戏目录生成运行诊断日志 XAudio2_9_BBFix.log（1 = 开启，0 = 关闭）
EnableLog=1
