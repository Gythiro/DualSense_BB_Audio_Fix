[BBFix]
; Bridges game's DualSense HD haptics from WASAPI Exclusive to Shared Mode.
; 解除 WASAPI 独占设备锁，使手柄喇叭 BB 语音与原生 HD 触觉反馈完美共存。
EnableSharedModeHaptics=1

; Fixes in-game audio menu device selection inversion bug (RVA 0x1DD4A00).
; 修复音频菜单切换 BB 设备时的底层寄存器漏传缺陷，选择手柄即刻生效。
FixBBDeviceSwapBug=1

; DualSense HD Haptics vibration intensity multiplier (Default: 1.0 = 100%, range: 0.0 - 4.0)
; DualSense HD 触觉震动强度倍率（默认 1.0 = 100% 原生强度，可调范围 0.0 ~ 4.0）
HapticsGain=1.0

; Corrects DualSense HID speaker routing in USB Output Reports.
; 修复游戏发给手柄的 HID 扬声器路由，支持 USB 直连与 Haute 4DS「跟随游戏」模式。
; Respects 3.5mm headset connection (1 = Enable, 0 = Disable).
; 插入 3.5mm 耳机时自动恢复耳机输出（1 = 开启，0 = 关闭）。
FixDualSenseSpeakerRouting=1

; Speaker Output Path: 3 = Right channel to internal speaker (Recommended)
; 扬声器通道映射：3 = 右声道进手柄内部扬声器（推荐）；2 = 左声道耳机，右声道喇叭
SpeakerOutputPath=3

; Controller speaker hardware volume level (range: 61 - 100, default: 100)
; 手柄喇叭硬件音量（61 ~ 100，默认 100）
SpeakerVolume=100

; Controller speaker pre-amp gain boost (range: 0 - 7, default: 2)
; 手柄喇叭前置放大增益（0 ~ 7，默认 2，与 Haute 网页增益一致）
SpeakerPreampGain=2

; Assume no 3.5mm headset is connected on startup (1 = Yes, 0 = No)
; 启动尚未收到耳机状态时，先假定未插耳机并开启手柄喇叭（1 = 是，0 = 否）
AssumeNoHeadsetAtStart=1

; Reassert speaker routing interval in milliseconds (default: 1000, 0 = only on game updates)
; 定时重发扬声器路由时间间隔（毫秒，默认 1000；0 = 仅在游戏下发时修补）
SpeakerReassertIntervalMs=1000

; Output diagnostic log XAudio2_9_BBFix.log in the game folder (1 = Enable, 0 = Disable)
; 是否在游戏目录生成运行诊断日志 XAudio2_9_BBFix.log（1 = 开启，0 = 关闭）
EnableLog=1
